server:
  tomcat:
    max-http-form-post-size: 256MB
    max-swallow-size: 256MB

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ion?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ion}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc.time_zone: Asia/Seoul

  # (MVC) 업로드 용량 제한
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 220MB
      file-size-threshold: 2MB

  # (WebFlux) 디코딩/멀티파트 버퍼
  codec:
    max-in-memory-size: 256MB
  webflux:
    multipart:
      max-in-memory-size: 256MB

logging:
  level:
    root: INFO
    org.springframework.boot.autoconfigure: INFO
    org.hibernate.SQL: INFO
    org.springframework.web.reactive.function.client: DEBUG

uploads:
  voice-dir: /var/app/uploads/voice

# ffmpeg 실행 경로 및 변환 타임아웃(서비스 코드 @Value 사용)
media:
  ffmpeg:
    path: /usr/bin/ffmpeg
  convert:
    timeoutSec: 120

voice-report:
  async:
    region: ${VOICE_REPORT_AWS_REGION:ap-northeast-2}
    bucket: ${VOICE_REPORT_S3_BUCKET:}
    queue-url: ${VOICE_REPORT_SQS_QUEUE_URL:}
    consumer-enabled: ${VOICE_REPORT_CONSUMER_ENABLED:false}
    poll-interval-ms: ${VOICE_REPORT_POLL_INTERVAL_MS:1000}
    wait-time-seconds: ${VOICE_REPORT_SQS_WAIT_TIME_SECONDS:10}
    visibility-timeout-seconds: ${VOICE_REPORT_SQS_VISIBILITY_TIMEOUT_SECONDS:900}
    processing-lease-seconds: ${VOICE_REPORT_PROCESSING_LEASE_SECONDS:900}

analysis:
  python:
    baseUrl: ${VOICE_REPORT_AI_BASE_URL:http://localhost:9095}
    connectTimeoutMs: 50000
    readTimeoutMs: 5000000

workbook:
  python:
    base-url-create: ${WORKBOOK_AI_BASE_URL:http://localhost:9096}
    base-url-feedback: ${WORKBOOK_FEEDBACK_AI_BASE_URL:http://localhost:9098}
    connect-timeout-ms: 50000
    read-timeout-ms: 600000


chatbot:
  python:
    base-url: ${CHATBOT_AI_BASE_URL:http://localhost:9097}
    connect-timeout-ms: 5000
    read-timeout-ms: 600000

demo:
  enabled: true
  user-id: u001

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
